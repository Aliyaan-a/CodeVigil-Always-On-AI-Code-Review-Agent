analyzers:
  ast:
    enabled: true
    max_complexity: 10
    max_cognitive_complexity: 15
    max_function_length: 50
    max_parameter_count: 5
    max_nesting_depth: 4
  security:
    enabled: true
    severity_threshold: info
  style:
    enabled: true
    max_line_length: 120
    enforce_docstrings: true
    enforce_type_hints: true
  llm:
    enabled: false

plugins:
  - security_scanner
  - performance_checker
  - docstring_enforcer

scoring:
  weights:
    security: 3.0
    bug: 2.5
    performance: 1.5
    style: 0.5
    maintainability: 1.0

reporting:
  format: console
  include_suggestions: true
  include_metrics: true
  severity_threshold: info
