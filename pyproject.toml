[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codevigil"
version = "0.1.0"
description = "AI-powered code review agent with multi-engine analysis pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aliyaan Ahmed", email = "aliyaanahmed001126@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
keywords = ["code-review", "static-analysis", "ai", "ast", "security"]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "gitpython>=3.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
    "tiktoken>=0.5",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
]
all = ["codevigil[llm,dev]"]

[project.scripts]
codevigil = "src.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Aliyaan-a/CodeVigil-Always-On-AI-Code-Review-Agent"
Repository = "https://github.com/Aliyaan-a/CodeVigil-Always-On-AI-Code-Review-Agent"
Issues = "https://github.com/Aliyaan-a/CodeVigil-Always-On-AI-Code-Review-Agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
# Style preferences the existing codebase does not follow. Black handles
# formatting, and subprocess calls to `git` are intentional.
ignore = [
    "E501", "E701", "N806", "TC001", "TC003", "PTH123", "SLF001",
    "SIM101", "SIM102", "SIM103", "SIM105", "SIM108", "SIM110",
    "B007", "B027", "B904", "B905", "ARG002",
    "S110", "S112", "S603", "S607",
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts by design.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
